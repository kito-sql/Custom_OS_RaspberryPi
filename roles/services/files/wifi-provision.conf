[Unit]
# This drop-in overrides unit ordering for screenflex-kiosk.service.
# The session launcher runs the Wi-Fi gate before reporting ready.
Requires=
After=
Wants=screenflex-framebuffer-splash.service
After=screenflex-framebuffer-splash.service local-fs.target
Before=gesture-engine.service gesture-overlay.service

[Service]
Type=notify
NotifyAccess=all
User=root
Group=root
WorkingDirectory=/opt/wifi-provision
Environment=DISPLAY=:0
Environment=XDG_RUNTIME_DIR=/tmp/screenflex-runtime
TTYPath=/dev/tty1
TTYReset=no
TTYVHangup=no
StandardInput=tty
ExecStart=
ExecStart=/usr/bin/xinit /usr/local/sbin/screenflex-boot-session -- /usr/bin/X :0 vt1 -keeptty -br -nolisten tcp -nocursor
Restart=on-failure
RestartPreventExitStatus=10
RestartSec=2
